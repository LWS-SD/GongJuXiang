 const y=+s.slice(6,10),m=+s.slice(10,12),d=+s.slice(12,14);const dt=new Date(y,m-1,d);const dateOk=dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d&&y>1900;

mk('生成','随机密码','可配置字符集，一次生成 8 个',[F.num('n','长度',16),F.chk('up','含大写字母',true),F.chk('lo','含小写字母',true),F.chk('di','含数字',true),F.chk('sy','含符号',false)],v=>{let pool='',need=[];const UP='ABCDEFGHIJKLMNOPQRSTUVWXYZ',LO='abcdefghijklmnopqrstuvwxyz',DI='0123456789',SY='!@#$%^&*()-_=+[]{};:,.<>?/|~';if(v.up){pool+=UP;need.push(UP);}if(v.lo){pool+=LO;need.push(LO);}if(v.di){pool+=DI;need.push(DI);}if(v.sy){pool+=SY;need.push(SY);}if(!pool){pool=LO+UP+DI;}const len=Math.max(4,Math.min(128,parseInt(v.n)||16));const out=[];for(let k=0;k<8;k++){let a=need.map(s=>pick([...s]));while(a.length<len)a.push(pick([...pool]));out.push(shuffle(a).join(''));}return out.join('\n');});

mk('数学','一元二次方程','ax²+bx+c=0 求根',[F.num('a','a',1),F.num('b','b',-3),F.num('c','c',2)],v=>{const a=parseFloat(v.a)||0,b=parseFloat(v.b)||0,c=parseFloat(v.c)||0;if(a===0)return b===0?(c===0?'任意 x 都成立':'无解'):'一次方程 x = '+fmtn(-c/b);const D=b*b-4*a*c;if(D>0)return 'Δ = '+fmtn(D)+' > 0，两个实根：\nx₁ = '+fmtn((-b+Math.sqrt(D))/(2*a))+'\nx₂ = '+fmtn((-b-Math.sqrt(D))/(2*a));if(D===0)return 'Δ = 0，唯一实根：\nx = '+fmtn(-b/(2*a));return 'Δ = '+fmtn(D)+' < 0，无实根，复根：\nx = '+fmtn(-b/(2*a))+' ± '+fmtn(Math.sqrt(-D)/(2*a))+'i';});

mk('生活','邮箱格式校验','检查邮箱格式是否规范',[F.in('s','邮箱','hello@example.com')],v=>{const t=v.s.trim();const ok=/^[\w.%+-]+@[\w-]+(\.[\w-]+)+$/.test(t)&&!/\.\./.test(t);return ok?'✅ 格式正确：'+t:'❌ 邮箱格式不正确';});
mk('生活','纸张尺寸表','常用纸张规格速查',[],()=>['A0  841 × 1189 mm','A1  594 × 841 mm','A2  420 × 594 mm','A3  297 × 420 mm','A4  210 × 297 mm','A5  148 × 210 mm','A6  105 × 148 mm','B5  176 × 250 mm','16开  185 × 260 mm','32开  130 × 184 mm','大32开  140 × 203 mm','名片  90 × 54 mm'].join('\n'));
mk('生活','烹饪单位换算','杯/汤匙/茶匙/毫升互换',[F.num('v','数量',1),F.sel('u','单位',[['ml','毫升'],['tsp','茶匙'],['tbsp','汤匙'],['cup','杯'],['oz','液量盎司']])],v=>{const u={ml:{n:'毫升',f:1},tsp:{n:'茶匙',f:5},tbsp:{n:'汤匙',f:15},cup:{n:'杯',f:240},oz:{n:'液量盎司',f:29.5735}};const x=parseFloat(v.v)||0;return '换算结果：\n'+fmtU(x*u[v.u].f,u);});
mk('生活','电费计算','功率×时长×电价',[F.num('p','电器功率（W）',1000),F.num('h','每天使用（小时）',4),F.num('d','天数',30),F.num('r','电价（元/度）',0.6)],v=>{const p=parseFloat(v.p)||0,h=parseFloat(v.h)||0,d=parseFloat(v.d)||0,r=parseFloat(v.r)||0;const kwh=p*h*d/1000;return '总耗电：'+fmtn(kwh)+' 度（kWh）\n电费估算：'+r2(kwh*r)+' 元\n（'+p+'W × '+h+'h/天 × '+d+'天）';});
mk('生活','工资换算','月薪/日薪/时薪/年薪互算',[F.num('v','数值',10000),F.sel('u','输入类型',[['m','月薪'],['d','日薪'],['h','时薪'],['y','年薪']])],v=>{const x=parseFloat(v.v)||0;let m;if(v.u==='m')m=x;else if(v.u==='d')m=x*21.75;else if(v.u==='h')m=x*21.75*8;else m=x/12;return '按每月 21.75 个工作日、每日 8 小时估算：\n月薪：'+r2(m)+' 元\n日薪：'+r2(m/21.75)+' 元\n时薪：'+r2(m/21.75/8)+' 元\n年薪：'+r2(m*12)+' 元';});
mk('生活','油耗换算','L/100km ↔ MPG（美制）',[F.num('v','数值',8),F.sel('m','方向',[['l2m','L/100km → MPG'],['m2l','MPG → L/100km']])],v=>{const x=parseFloat(v.v);if(!(x>0))return '❌ 请输入正数';return v.m==='l2m'?x+' L/100km ≈ '+r2(235.214583/x)+' MPG（美制）':x+' MPG ≈ '+r2(235.214583/x)+' L/100km';});
/* ================= 界面逻辑 ================= */
const grid=$('#grid'),cats=$('#cats'),dlg=$('#dlg'),dform=$('#dform'),dtitle=$('#dtitle'),ddesc=$('#ddesc'),dout=$('#dout');
let cur=null,curCat='全部';
$('#cnt').textContent=T.length;
const CATLIST=[...new Set(T.map(t=>t.cat))];
['全部',...CATLIST].forEach(c=>{const b=document.createElement('button');b.textContent=c+(c==='全部'?'（'+T.length+'）':'（'+T.filter(t=>t.cat===c).length+'）');b.className=c==='全部'?'on':'';b.onclick=()=>{curCat=c;[...cats.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');render();};cats.appendChild(b);});
function render(){const kw=$('#q').value.trim().toLowerCase();grid.innerHTML='';let n=0;T.forEach((t,i)=>{if(curCat!=='全部'&&t.cat!==curCat)return;if(kw&&!(t.name+t.desc+t.cat).toLowerCase().includes(kw))return;n++;const el=document.createElement('button');el.className='card';const b=document.createElement('b');b.textContent=t.name;const sp=document.createElement('span');sp.textContent=t.desc;const it=document.createElement('i');it.textContent=t.cat;el.append(b,sp,it);el.onclick=()=>openTool(i);grid.appendChild(el);});if(!n){const p=document.createElement('p');p.textContent='没有找到匹配的工具 🤔';p.style.color='var(--sub)';grid.appendChild(p);}}
$('#q').addEventListener('input',render);
function renderIns(t){dform.innerHTML='';t.ins.forEach(x=>{if(x.t==='chk'){const lb=document.createElement('label');lb.className='chk';const el=document.createElement('input');el.type='checkbox';el.id='k_'+x.k;el.checked=!!x.v;lb.appendChild(el);lb.appendChild(document.createTextNode(' '+x.l));dform.appendChild(lb);return;}const w=document.createElement('div');w.className='fld';const lb=document.createElement('label');lb.textContent=x.l||x.k;lb.htmlFor='k_'+x.k;w.appendChild(lb);let el;if(x.t==='ta'){el=document.createElement('textarea');el.rows=x.r||6;el.placeholder=x.ph||'在此输入内容…';}else if(x.t==='sel'){el=document.createElement('select');x.o.forEach(o=>{const op=document.createElement('option');op.value=o[0];op.textContent=o[1];el.appendChild(op);});}else{el=document.createElement('input');el.type=x.t==='num'?'number':'text';if(x.v!==undefined)el.value=x.v;el.placeholder=x.ph||'';}el.id='k_'+x.k;w.appendChild(el);dform.appendChild(w);});}
function openTool(i){cur=T[i];dtitle.textContent=cur.name;ddesc.textContent=cur.desc+'　·　'+cur.cat;renderIns(cur);dout.textContent='结果将显示在这里…';dlg.showModal();const f=dform.querySelector('textarea,input,select');if(f)setTimeout(()=>f.focus(),50);}
function collect(){const v={};cur.ins.forEach(x=>{const el=$('#k_'+x.k);v[x.k]=x.t==='chk'?el.checked:el.value;});return v;}
async function run(){if(!cur)return;dout.textContent='计算中…';try{const v=collect();const r=await cur.fn(v);dout.textContent=r==null?'(无输出)':String(r);}catch(e){dout.textContent='❌ 运行出错：'+(e&&e.message?e.message:e);}}
$('#run').onclick=run;
$('#clr').onclick=()=>{dform.querySelectorAll('textarea,input[type=text],input[type=number]').forEach(el=>el.value='');dout.textContent='结果将显示在这里…';};
$('#close').onclick=()=>dlg.close();
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.tm);toast.tm=setTimeout(()=>t.classList.remove('show'),1600);}
$('#copy').onclick=()=>{const t=dout.textContent;if(!t||t==='结果将显示在这里…')return;const done=()=>toast('已复制到剪贴板 ✓');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done).catch(fb);}else fb();function fb(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择复制');}ta.remove();}};
dform.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run();});
render();
if(T.length!==200)console.warn('工具数量为 '+T.length+'，与预期的 200 不符');
document.querySelector('footer').textContent='单文件工具箱 · 共 '+T.length+' 个工具 · 可自由部署到 GitHub Pages · © '+new Date().getFullYear();
</script>
<script src="v2.js"></script>
